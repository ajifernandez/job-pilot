# Dockge: "+ Compose" -> nombre "job-pilot" -> pega esto -> en ".env" del stack pon
# GEMINI_API_KEY=... y POSTGRES_PASSWORD=... -> Deploy. "Rebuild" = último commit de main.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: jobpilot
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot"]
      interval: 5s
      retries: 10

  app:
    image: job-pilot:local
    pull_policy: build
    build:
      context: https://github.com/ajifernandez/job-pilot.git#main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8420}:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?falta GEMINI_API_KEY}
      GEMINI_MODEL_SEARCH: ${GEMINI_MODEL_SEARCH:-gemini-3.8-flash}
      GEMINI_MODEL_EXTRACT: ${GEMINI_MODEL_EXTRACT:-gemini-3.5-flash-lite}
      GEMINI_MODEL_WRITE: ${GEMINI_MODEL_WRITE:-gemini-3.8-flash}
      SEARCH_INTERVAL_HOURS: ${SEARCH_INTERVAL_HOURS:-12}
      DATABASE_URL: postgresql+psycopg://jobpilot:${POSTGRES_PASSWORD:-jobpilot}@db:5432/jobpilot

volumes:
  db_data:
